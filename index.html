<style>
:root {
  --mc-bg: #05080d;
  --mc-panel: #0b1420;
  --mc-cyan: #4fd8ff;
  --mc-blue: #1e6fa8;
  --mc-amber: #ffb84d;
  --mc-red: #ff5c5c;
  --mc-grid: rgba(79, 216, 255, 0.08);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: 'Share Tech Mono', monospace;
  color: var(--mc-cyan);
  background-color: var(--mc-bg);
  background-image:
    linear-gradient(var(--mc-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--mc-grid) 1px, transparent 1px),
    radial-gradient(ellipse at center, #0d1b2a 0%, #05080d 75%);
  background-size: 40px 40px, 40px 40px, cover;
  background-attachment: fixed;
  background-repeat: repeat, repeat, no-repeat;
  min-height: 100vh;
  overflow-x: hidden;
}

/* subtle scanline overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.02) 0px,
    rgba(255,255,255,0.02) 1px,
    transparent 2px,
    transparent 4px
  );
  z-index: 5000;
}

.scroll-container {
  width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  padding: 14px 16px;
  background: linear-gradient(180deg, rgba(11,20,32,0.95), rgba(11,20,32,0.75));
  border: 1px solid var(--mc-blue);
  border-left: none;
  border-right: none;
  box-shadow: 0 0 20px rgba(79, 216, 255, 0.15), inset 0 0 30px rgba(79, 216, 255, 0.05);
  backdrop-filter: blur(2px);
}

.scroll-content {
  display: inline-flex;
  align-items: center;
}

.button {
  margin-right: 10px;
  padding: 10px 20px;
  background-color: rgba(30, 111, 168, 0.15);
  color: var(--mc-cyan);
  border: 1px solid var(--mc-cyan);
  border-radius: 3px;
  cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s ease;
}

.button::before {
  content: "▸ ";
  color: var(--mc-amber);
}

.button:hover {
  background-color: rgba(79, 216, 255, 0.2);
  box-shadow: 0 0 12px rgba(79, 216, 255, 0.6);
  color: #ffffff;
  animation: size 1s infinite ease-in-out;
}

@keyframes float {
  12.5% { transform: translateY(0px); }
  25% { transform: translateY(1px); }
  37.5% { transform: translateY(2px); }
  50% { transform: translateY(1px); }
  62.5% { transform: translateY(0px); }
  75% { transform: translateY(-1px); }
  87.5% { transform: translateY(-2px); }
  100% { transform: translateY(-1px); }
}

@keyframes size {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 8px rgba(79, 216, 255, 0.3); }
  50% { box-shadow: 0 0 18px rgba(79, 216, 255, 0.7); }
}

#viewerContainer {
  position: relative;
}

#fullscreenButton {
  position: fixed;
  bottom: 16px;
  left: 45%;
  background-color: var(--mc-panel);
  color: var(--mc-amber);
  padding: 14px 28px;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid var(--mc-amber);
  border-radius: 4px;
  cursor: se-resize;
  animation: pulseGlow 3s infinite;
}

#fullscreenButton:hover {
  background-color: rgba(255, 184, 77, 0.15);
  color: #ffffff;
  animation: size 1s infinite ease-in-out;
}

#toggleModeButton {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background-color: var(--mc-panel);
  color: var(--mc-cyan);
  padding: 14px 28px;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid var(--mc-cyan);
  border-radius: 4px;
  cursor: wait;
  animation: pulseGlow 3s infinite;
}

#toggleModeButton:hover {
  background-color: rgba(79, 216, 255, 0.15);
  color: #ffffff;
  animation: size 1s infinite ease-in-out;
}

#overlayImage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 9999;
  display: block;
}

.embed {
  border: 1px solid var(--mc-blue);
  box-shadow: 0 0 25px rgba(30, 111, 168, 0.35);
}

/* footer / attribution bar styled like a status readout */
p {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: #5a7d94;
  text-align: center;
  padding: 8px;
  margin: 0;
  border-top: 1px solid rgba(79, 216, 255, 0.15);
  background: rgba(5, 8, 13, 0.9);
}

p a {
  color: var(--mc-cyan);
  text-decoration: none;
}

p a:hover {
  text-decoration: underline;
}
</style>
</head>

<div id="viewerContainer"></div>
<button id="fullscreenButton" onclick="toggleFullscreen()">Go Fullscreen</button>
<button id="toggleModeButton" onclick="toggleMode()">Use iframe</button>
<script>
let useIframe = false;
document.addEventListener('keydown', function (event) {
if (event.code === 'Backspace') {
window.location.href = 'https://www.google.com';
}
});

function changeEmbed(url) {
const container = document.getElementById('viewerContainer');
container.innerHTML = '';
const element = document.createElement(useIframe ? 'iframe' : 'embed');
element.src = url;
element.width = '100%';
element.height = window.innerHeight + 'px';
element.className = 'embed';
element.allowFullscreen = true;
container.appendChild(element);
}

window.onresize = function () {
const viewer = document.getElementById('viewerContainer').firstChild;
if (viewer) viewer.style.height = window.innerHeight + 'px';
};

function toggleFullscreen() {
const viewer = document.getElementById('viewerContainer').firstChild;
if (!viewer) return;
if (viewer.requestFullscreen) viewer.requestFullscreen();
else if (viewer.mozRequestFullScreen) viewer.mozRequestFullScreen();
else if (viewer.webkitRequestFullscreen) viewer.webkitRequestFullscreen();
else if (viewer.msRequestFullscreen) viewer.msRequestFullscreen();
}

function toggleMode() {
useIframe = !useIframe;
const btn = document.getElementById('toggleModeButton');
btn.textContent = useIframe ? 'Use embed' : 'Use iframe';
const currentSrc = document.getElementById('viewerContainer').firstChild?.src;
if (currentSrc) {
changeEmbed(currentSrc);
}
}

function hideOverlay() {
var overlayImage = document.getElementById('overlayImage');
overlayImage.style.display = 'none';
}
</script>
